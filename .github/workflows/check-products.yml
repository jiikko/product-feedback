name: check-products

# プロダクトの一覧 (Issue フォーム 3 件・labels.yml・README) の食い違いを落とす。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ruby bin/check-products
